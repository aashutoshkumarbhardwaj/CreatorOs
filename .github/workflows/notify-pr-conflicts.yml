name: "Notify PR author on merge conflicts"

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  check-conflicts:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check PR mergeable state and notify author if conflicts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_USER: ${{ github.event.pull_request.user.login }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          API_URL="https://api.github.com/repos/$OWNER/$REPO/pulls/$PR_NUMBER"

          echo "Polling PR mergeable state (up to 10 attempts)..."
          mergeable=null
          mergeable_state="unknown"
          for i in $(seq 1 10); do
            echo "Attempt $i"
            resp=$(curl -sS -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" "$API_URL")
            mergeable=$(echo "$resp" | jq -r .mergeable)
            mergeable_state=$(echo "$resp" | jq -r .mergeable_state)
            echo "mergeable=$mergeable mergeable_state=$mergeable_state"
            if [ "$mergeable" != "null" ]; then
              break
            fi
            sleep 2
          done

          # Consider conflicts when mergeable is false or mergeable_state is 'dirty'
          if [ "$mergeable" = "false" ] || [ "$mergeable_state" = "dirty" ]; then
            echo "Merge conflicts detected for PR #$PR_NUMBER (mergeable_state=$mergeable_state). Preparing comment..."
            ISSUE_COMMENTS_API="https://api.github.com/repos/$OWNER/$REPO/issues/$PR_NUMBER/comments"

            # Compose message
            MSG="@${PR_USER} Hi — this pull request has merge conflicts (mergeable_state=$mergeable_state). Please rebase or merge the base branch into your branch to resolve them. If you need help, reply here or request a maintainer's assistance."

            # Avoid posting duplicate identical comments from this bot
            BOT_LOGIN=$(curl -sS -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/user | jq -r .login)
            echo "Bot login: $BOT_LOGIN"

            existing=$(curl -sS -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" "$ISSUE_COMMENTS_API" | jq -r --arg bot "$BOT_LOGIN" --arg msg "$MSG" '.[] | select(.user.login==$bot and .body==$msg) | .id' | head -n1 || true)
            if [ -n "$existing" ]; then
              echo "Identical bot comment already exists (id=$existing). Skipping posting another comment."
              exit 0
            fi

            payload=$(jq -nc --arg body "$MSG" '{body:$body}')
            echo "Posting comment to PR #$PR_NUMBER..."
            curl -sS -X POST -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" "$ISSUE_COMMENTS_API" -d "$payload"
            echo "Comment posted."
          else
            echo "No merge conflicts detected (mergeable=$mergeable mergeable_state=$mergeable_state)."
          fi
