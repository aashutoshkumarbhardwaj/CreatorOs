
# ==================================================
# GLOBAL CONFIGURATION
# ==================================================

user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
}

# ==================================================
# HTTP CONFIGURATION
# ==================================================

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Hide Nginx version
    server_tokens off;

    # --------------------------------------------------
    # LOGGING
    # --------------------------------------------------

    log_format main
        '$remote_addr - $remote_user [$time_local] '
        '"$request" $status $body_bytes_sent '
        '"$http_referer" "$http_user_agent" '
        '"$http_x_forwarded_for" '
        'request_time=$request_time '
        'upstream_time=$upstream_response_time';

    access_log /var/log/nginx/access.log main;

    # --------------------------------------------------
    # PERFORMANCE OPTIMIZATION
    # --------------------------------------------------

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    keepalive_timeout 65;
    keepalive_requests 1000;

    types_hash_max_size 4096;
    client_body_timeout 60s;
    client_header_timeout 60s;
    send_timeout 60s;

    # --------------------------------------------------
    # GZIP COMPRESSION
    # --------------------------------------------------

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;

    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        application/atom+xml
        image/svg+xml;

    # --------------------------------------------------
    # WEBSOCKET CONNECTION HANDLING
    # --------------------------------------------------

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    # --------------------------------------------------
    # UPSTREAM APPLICATION
    # --------------------------------------------------

    upstream web_app {
        least_conn;

        server web:3000 max_fails=3 fail_timeout=10s;

        # Keep connections alive with the Node.js server
        keepalive 32;
    }

    # ==================================================
    # MAIN SERVER
    # ==================================================

    server {
        listen 80;
        server_name localhost;

        # --------------------------------------------------
        # CLIENT UPLOAD CONFIGURATION
        # --------------------------------------------------

        client_max_body_size 50M;
        client_body_buffer_size 128k;

        # --------------------------------------------------
        # SECURITY HEADERS
        # --------------------------------------------------

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # --------------------------------------------------
        # HEALTH CHECK
        # --------------------------------------------------

        location = /health {
            proxy_pass http://web_app/health;

            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;

            access_log off;
        }

        # --------------------------------------------------
        # PROMETHEUS METRICS
        # --------------------------------------------------

        location = /metrics {
            proxy_pass http://web_app/metrics;

            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;

            access_log off;
        }

        # --------------------------------------------------
        # MAIN APPLICATION REVERSE PROXY
        # --------------------------------------------------

        location / {
            proxy_pass http://web_app;

            proxy_http_version 1.1;

            # WebSocket support
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # Forward client information
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Proxy connection settings
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # Request and response buffering
            proxy_request_buffering on;
            proxy_buffering on;

            proxy_buffer_size 16k;
            proxy_buffers 8 16k;
            proxy_busy_buffers_size 32k;

            # Avoid forwarding the upstream server's
            # implementation-specific headers
            proxy_hide_header X-Powered-By;
        }

        # --------------------------------------------------
        # ERROR HANDLING
        # --------------------------------------------------

        error_page 500 502 503 504 /50x.html;

        location = /50x.html {
            root /usr/share/nginx/html;
            internal;
        }

        # --------------------------------------------------
        # BLOCK HIDDEN FILES
        # --------------------------------------------------

        location ~ /\.(?!well-known) {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
